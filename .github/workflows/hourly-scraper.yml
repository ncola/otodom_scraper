name: Hourly Otodom latest scraper Katowice

on:
  schedule:
    - cron: "0 * * * *"  # every hour at :00 (e.g. 8:00, 9:00, 10:00...)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > .env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SSLMODE=${{ secrets.DB_SSLMODE }}
          SCRAPE_MODE=latest
          LATEST_MAX_PAGES=2
          EOF

      - name: Run scraper
        run: docker compose -f docker-compose.github.yml up --build --abort-on-container-exit scraper_latest

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-latest-logs
          path: logs/
